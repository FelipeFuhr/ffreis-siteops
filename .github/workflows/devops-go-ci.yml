name: DevOps / Go CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod-tidy:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mod-tidy-check.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25.13"
      working-directory: "."

  fmt:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25.13"
      working-directory: "."

  lint:
    needs: [fmt]
    permissions:
      contents: read
      # scan-fix(gha:workflow-permissions): go-lint.yml's nested job needs
      # pull-requests: read for golangci-lint-action to fetch the PR diff —
      # caller must grant a superset or GitHub refuses to start the run.
      pull-requests: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-lint.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25.13"
      working-directory: "."

  test:
    if: ${{ !github.event.pull_request.draft }}
    needs: [fmt]
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@c3d274cf44074f49908948305861c74714cdc9d9 # v1.3.0
    with:
      go-version: "1.25.13"
      working-directory: "."
